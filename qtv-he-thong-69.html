<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL V3.5 - BULK MODE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b1120; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: #1e293b; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; text-transform: uppercase; margin-bottom: 25px; }
        input { width: 100%; box-sizing: border-box; padding: 14px; margin-bottom: 15px; background-color: #0f172a; border: 1px solid #475569; color: #38bdf8; border-radius: 8px; outline: none; }
        .mode-switch { background: #334155; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 12px; }
        .btn-create { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; }
        .btn-delete { background: #f43f5e; color: white; opacity: 0.8; font-size: 12px; }
        #logBox { background: #000; color: #a3e635; padding: 12px; border-radius: 8px; font-size: 12px; height: 120px; overflow-y: auto; font-family: monospace; border: 1px solid #334155; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 XƯỞNG IN KEY SLL V3.5</h2>
        
        <input type="text" id="supaUrl" placeholder="Supabase URL">
        <input type="password" id="supaKey" placeholder="Supabase API Key">
        <input type="number" id="numKeys" placeholder="Số lượng (Ví dụ: 10000)">
        
        <div class="mode-switch">
            <span>⚡ Chế độ siêu tốc (Không hiện mã)</span>
            <input type="checkbox" id="bulkMode" checked style="width: auto; margin: 0;">
        </div>

        <button class="btn-create" onclick="createKeys()">🔥 BẮT ĐẦU BƠM KEY</button>
        
        <div id="logBox">Sẵn sàng...</div>

        <button class="btn-delete" onclick="deleteAllKeys()">💀 DỌN SẠCH KHO</button>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('savedUrl')) document.getElementById('supaUrl').value = localStorage.getItem('savedUrl');
            if(localStorage.getItem('savedKey')) document.getElementById('supaKey').value = localStorage.getItem('savedKey');
        }

        async function createKeys() {
            const url = document.getElementById('supaUrl').value.trim();
            const key = document.getElementById('supaKey').value.trim();
            const count = parseInt(document.getElementById('numKeys').value);
            const isBulk = document.getElementById('bulkMode').checked;
            const logBox = document.getElementById('logBox');

            if (!url || !key || !count) return Swal.fire('Thiếu dữ liệu!', 'Điền đủ thông số sếp ơi!', 'warning');
            
            localStorage.setItem('savedUrl', url);
            localStorage.setItem('savedKey', key);

            const supaClient = supabase.createClient(url, key);
            let allGeneratedKeys = [];
            logBox.innerHTML = "⏳ Đang chuẩn bị dữ liệu...<br>";

            const chunkSize = 1000;
            for (let i = 0; i < count; i += chunkSize) {
                const currentBatchSize = Math.min(chunkSize, count - i);
                const batchData = [];
                for (let j = 0; j < currentBatchSize; j++) {
                    const k = `VIP-${Math.random().toString(36).substr(2, 4).toUpperCase()}-${Math.random().toString(36).substr(2, 4).toUpperCase()}`;
                    batchData.push({ code: k });
                    allGeneratedKeys.push(k);
                }

                const { error } = await supaClient.from('vouchers').insert(batchData);
                if (error) return Swal.fire('Lỗi!', error.message, 'error');
                
                logBox.innerHTML += `✅ Đã bơm: ${Math.min(i + chunkSize, count)}/${count}<br>`;
                logBox.scrollTop = logBox.scrollHeight;
            }

            Swal.fire({
                title: 'THÀNH CÔNG!',
                text: `Đã nạp ${count} Key. Sếp muốn tải file về luôn không?`,
                icon: 'success',
                showCancelButton: true,
                confirmButtonText: 'Tải File .txt',
                cancelButtonText: 'Để sau'
            }).then((result) => {
                if (result.isConfirmed) {
                    const blob = new Blob([allGeneratedKeys.join('\n')], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `SLL_Keys_${count}_${new Date().getTime()}.txt`;
                    a.click();
                }
            });
        }

        async function deleteAllKeys() {
            const url = document.getElementById('supaUrl').value.trim();
            const key = document.getElementById('supaKey').value.trim();
            if (!url || !key) return Swal.fire('Lỗi!', 'Nhập API Key mới xóa được!', 'error');

            const result = await Swal.fire({
                title: 'XÓA SẠCH KHO?',
                text: "Toàn bộ dữ liệu sẽ bay màu!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f43f5e',
                confirmButtonText: 'Xóa ngay!',
                cancelButtonText: 'Hủy'
            });

            if (result.isConfirmed) {
                const supaClient = supabase.createClient(url, key);
                Swal.fire({ title: 'Đang dọn kho...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                
                let keepDeleting = true;
                while (keepDeleting) {
                    const { data, error } = await supaClient.from('vouchers').select('code').limit(1000);
                    if (error || data.length === 0) { keepDeleting = false; break; }
                    const keys = data.map(i => i.code);
                    await supaClient.from('vouchers').delete().in('code', keys);
                }
                Swal.fire('Xong!', 'Kho đã sạch bóng quân thù.', 'success');
            }
        }
    </script>
</body>
</html>
