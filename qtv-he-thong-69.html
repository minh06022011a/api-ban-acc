<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị Key - V2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #e2e8f0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, textarea { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; }
        button { width: 95%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-create { background: #38bdf8; color: #0f172a; }
        .btn-download { background: #10b981; color: white; }
        .btn-delete { background: #f43f5e; color: white; }
        .btn-create:hover { background: #7dd3fc; }
        #status { margin-top: 15px; font-weight: bold; color: #fbbf24; }
        .log-box { height: 150px; overflow-y: auto; text-align: left; font-size: 12px; background: #000; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠 QUẢN TRỊ VIÊN HỆ THỐNG 69</h2>
    
    <input type="text" id="supaUrl" placeholder="Nhập Supabase URL">
    <input type="password" id="supaKey" placeholder="Nhập Supabase API Key (service_role)">
    <input type="number" id="numKeys" placeholder="Số lượng Key muốn tạo (Khuyên dùng < 5000)">
    
    <button class="btn-create" onclick="createKeys()">🚀 BƠM KEY LÊN HỆ THỐNG</button>
    
    <div id="resultArea" style="display:none;">
        <div id="status"></div>
        <button class="btn-download" onclick="downloadTxt()">📥 TẢI FILE KEY (.TXT)</button>
        <div class="log-box" id="logBox"></div>
    </div>

    <hr style="border: 0.5px solid #334155; margin: 20px 0;">
    
    <button class="btn-delete" onclick="deleteAllKeys()">💀 XÓA SẠCH DATABASE (DỌN KHO)</button>
</div>

<script>
    let generatedKeys = [];

    async function createKeys() {
        const url = document.getElementById('supaUrl').value;
        const key = document.getElementById('supaKey').value;
        const count = parseInt(document.getElementById('numKeys').value);
        const status = document.getElementById('status');
        const logBox = document.getElementById('logBox');

        if (!url || !key || !count) return alert("Sếp nhập thiếu thông tin kìa!");

        const supabase = supabase.createClient(url, key);
        status.innerText = "⏳ Đang 'nặn' Key và bơm dữ liệu...";
        generatedKeys = [];
        logBox.innerHTML = "";
        document.getElementById('resultArea').style.display = "block";

        const dataToInsert = [];
        for (let i = 0; i < count; i++) {
            const newKey = `VIP-${Math.random().toString(36).substr(2, 4).toUpperCase()}-${Math.random().toString(36).substr(2, 4).toUpperCase()}`;
            dataToInsert.push({ code: newKey, status: 'live' });
            generatedKeys.push(newKey);
        }

        // Bơm dữ liệu theo lô để né lỗi Payload Too Large
        const chunkSize = 1000;
        for (let i = 0; i < dataToInsert.length; i += chunkSize) {
            const chunk = dataToInsert.slice(i, i + chunkSize);
            const { error } = await supabase.from('vouchers').insert(chunk);
            if (error) {
                status.innerText = "❌ Lỗi: " + error.message;
                return;
            }
            logBox.innerHTML += `✅ Đã bơm xong ${i + chunk.length}/${count} key...<br>`;
        }

        status.innerText = `🎉 THÀNH CÔNG! Đã tạo ${count} Key.`;
    }

    // HÀM HACK NÉ LỖI COPY: Tải file trực tiếp
    function downloadTxt() {
        if (generatedKeys.length === 0) return alert("Có gì đâu mà tải sếp?");
        const blob = new Blob([generatedKeys.join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Lô_Key_Edu_${new Date().getTime()}.txt`;
        a.click();
    }

    // HÀM XÓA SẠCH DATABASE (DỌN KHO)
    async function deleteAllKeys() {
        const confirmDel = confirm("CẢNH BÁO: Sếp có chắc muốn XÓA SẠCH toàn bộ Key trong Database không? Không khôi phục được đâu nhé!");
        if (!confirmDel) return;

        const url = document.getElementById('supaUrl').value;
        const key = document.getElementById('supaKey').value;
        if (!url || !key) return alert("Sếp nhập URL và Key vào mới xóa được chứ!");

        const supabase = supabase.createClient(url, key);
        document.getElementById('status').innerText = "⏳ Đang quét sạch kho... Đợi tí...";

        // Xóa tất cả dòng
        const { error } = await supabase.from('vouchers').delete().neq('status', 'nothing');

        if (error) {
            alert("Lỗi khi xóa: " + error.message);
        } else {
            alert("🔥 ĐÃ DỌN SẠCH KHO! Database trống rỗng rồi sếp.");
            document.getElementById('status').innerText = "✅ Kho đã trống.";
            document.getElementById('logBox').innerHTML = "";
            generatedKeys = [];
        }
    }
</script>
</body>
</html>
