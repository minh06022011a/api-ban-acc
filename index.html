<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SÀN GIAO DỊCH MMO V10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="data.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-[0_0_40px_rgba(56,189,248,0.15)] border border-slate-700 p-8">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 mb-2">HỆ THỐNG GET DATA</h2>
        </div>

        <div class="mb-5">
            <label class="block text-sm font-bold text-cyan-400 mb-2">1. KHÁM PHÁ MÓN HÀNG</label>
            <input type="text" id="searchClient" oninput="renderClientProducts(this.value)" placeholder="🔍 Tìm nhanh (VD: Tiktok...)" class="w-full bg-slate-900 border border-slate-600 border-b-0 rounded-t-lg p-3 text-cyan-300 outline-none focus:border-cyan-400">
            <select id="productSelect" class="w-full bg-slate-900 border border-slate-600 rounded-b-lg p-3 text-white outline-none cursor-pointer text-sm"></select>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-bold text-cyan-400 mb-2">2. NHẬP KEY CỦA SẾP</label>
            <input type="text" id="keyInput" placeholder="VD: VIP-XXXX" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-emerald-400 font-mono tracking-wider outline-none uppercase">
        </div>

        <button onclick="processKey('buy')" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 text-white font-bold py-4 rounded-lg shadow-lg uppercase tracking-wider mb-3">
            🚀 Tiến Hành Lấy Hàng
        </button>
        
        <button onclick="processKey('check')" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-300 font-bold py-3 rounded-lg shadow-lg uppercase transition">
            🔎 Tra Cứu Lại Key Đã Mua
        </button>

        <div id="resultArea" class="mt-6 hidden">
            <div class="p-4 bg-black border border-emerald-500/30 rounded-lg mb-3">
                <p id="resultTitle" class="text-xs text-slate-400 mb-2">HÀNG CỦA SẾP ĐÂY:</p>
                <textarea id="dataOutput" readonly class="w-full bg-transparent text-emerald-400 font-mono text-sm resize-none outline-none h-24" spellcheck="false"></textarea>
            </div>
            <button id="downloadBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg flex justify-center w-full gap-2 transition">⬇️ TẢI LƯU VỀ MÁY</button>
        </div>
    </div>

    <script>
        window.hiddenProducts = [];
        window.customNames = {};

        window.onload = async () => {
            if (typeof DANH_MUC_SP === 'undefined') return alert('Lỗi: Thiếu file data.js!');
            const selectBox = document.getElementById('productSelect');
            selectBox.innerHTML = '<option>⏳ Đang đồng bộ máy chủ...</option>';
            try {
                const res = await fetch('https://api-ban-acc-6r4g.vercel.app/api/redeem');
                const data = await res.json();
                window.hiddenProducts = data.hidden || [];
                window.customNames = data.customNames || {};
            } catch(e) { console.log(e); }
            renderClientProducts();
        };

        function renderClientProducts(filterText = '') {
            const selectBox = document.getElementById('productSelect');
            selectBox.innerHTML = '';
            let count = 0;
            DANH_MUC_SP.forEach(sp => {
                if (window.hiddenProducts.includes(sp.id)) return;
                
                // NẾU CÓ TÊN CUSTOM THÌ LẤY TÊN CUSTOM, NẾU KHÔNG THÌ CẮT GIÁ
                let displayTitle = window.customNames[sp.id] ? window.customNames[sp.id] : sp.name.replace(/\s*\(\s*Giá:.*?\)\s*/i, '').trim();
                let fullText = `[${sp.prefix}] - ${displayTitle}`;
                
                if (fullText.toLowerCase().includes(filterText.toLowerCase())) {
                    let option = document.createElement('option');
                    option.value = sp.id;
                    option.setAttribute('data-prefix', sp.prefix);
                    option.text = fullText;
                    selectBox.appendChild(option);
                    count++;
                }
            });
            if (count === 0) selectBox.innerHTML = '<option>Không tìm thấy món hàng nào!</option>';
        }

        async function processKey(actionType) {
            const userInput = document.getElementById('keyInput').value.trim().toUpperCase();
            if (!userInput) return Swal.fire('Lỗi', 'Chưa nhập Key sếp ơi!', 'warning');

            const selectBox = document.getElementById('productSelect');
            const sp_id = selectBox.value; 

            Swal.fire({ title: actionType === 'check' ? 'Đang lục kho...' : 'Đang móc túi sàn...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

            try {
                const response = await fetch('https://api-ban-acc-6r4g.vercel.app/api/redeem', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userKey: userInput, productId: sp_id, action: actionType })
                });

                const result = await response.json();
                
                if (result.error) {
                    Swal.fire('Thất bại!', result.error, 'error');
                } else {
                    document.getElementById('resultArea').classList.remove('hidden');
                    document.getElementById('dataOutput').value = result.data;
                    document.getElementById('resultTitle').innerText = result.isCheck ? `TÀI KHOẢN MUA LÚC: ${result.time}` : 'HÀNG CỦA SẾP ĐÂY:';
                    
                    Swal.fire('Thành Công!', actionType === 'check' ? 'Đã tìm thấy tài khoản cũ!' : 'Húp data mượt mà!', 'success');

                    document.getElementById('downloadBtn').onclick = () => {
                        const blob = new Blob([result.data], { type: 'text/plain' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `DATA_${userInput}.txt`;
                        a.click();
                    };
                }
            } catch (err) {
                Swal.fire('LỖI MẠNG', 'Vercel tịt ngòi: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
