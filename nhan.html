<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>NHẬN KEY CHÉM GIÁ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full bg-slate-900 p-6 rounded-xl border border-slate-700 text-center">
        <h1 class="text-xl font-bold mb-4">🔑 MÃ KEY CỦA BẠN</h1>
        <div id="result" class="bg-slate-800 p-4 rounded text-2xl font-black text-emerald-400">ĐANG GIẢI MÃ...</div>
    </div>
    <script>
        function giaiMa(str) {
            try { return decodeURIComponent(escape(atob(str.slice(0, -3).split('').reverse().join('')))); } 
            catch(e) { return null; }
        }
        const k = new URLSearchParams(window.location.search).get('d');
        const key = k ? giaiMa(k) : null;
        document.getElementById('result').innerText = key || "LỖI GIẢI MÃ";
    </script>
</body>
</html>
