<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Xuất Mail Edu VIP</title>
    <style>
        body { font-family: Arial; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .container { background: #fff; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 12px; margin-bottom: 20px; text-align: center; font-weight: bold; }
        button { padding: 12px 25px; cursor: pointer; color: #fff; font-weight: bold; border: none; border-radius: 5px;}
        .btn-nhan { background-color: #28a745; }
        .btn-tai { background-color: #007bff; display: none; }
        textarea { width: 100%; height: 150px; margin-top: 20px; display: none; padding: 10px; font-family: monospace;}
        #loading { display: none; color: #d39e00; margin-top: 10px; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <h2>🎁 TRẠM ĐỔI MÃ VOUCHER</h2>
    <input type="text" id="maVoucher" placeholder="Nhập mã Voucher mua trên Avia...">
    <br>
    <button class="btn-nhan" onclick="nhanHang()">TIẾN HÀNH XUẤT KHO</button>
    <p id="loading">⏳ Hệ thống đang check mã và gọi hàng, chờ tí...</p>

    <textarea id="ketQua" readonly></textarea>
    <button id="btnTaiTxt" class="btn-tai" onclick="taiFileTxt()">📥 Tải File TXT</button>
</div>

<script>
    async function nhanHang() {
        const maCode = document.getElementById('maVoucher').value.trim();
        if (!maCode) return alert('Nhập mã vào đi người anh em!');

        document.getElementById('loading').style.display = 'block';
        document.getElementById('ketQua').style.display = 'none';
        document.getElementById('btnTaiTxt').style.display = 'none';

        try {
            // ANH ĐÃ RÁP SẴN LINK VERCEL CỦA SẾP VÀO ĐÂY RỒI NHÉ!
            const response = await fetch(`https://api-ban-acc-6r4g.vercel.app/api/redeem?code=${maCode}`);
            const result = await response.json();

            document.getElementById('loading').style.display = 'none';

            if (result.success) {
                document.getElementById('ketQua').value = result.data;
                document.getElementById('ketQua').style.display = 'block';
                document.getElementById('btnTaiTxt').style.display = 'inline-block';
            } else {
                alert('Lỗi: ' + result.error);
            }
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            alert('Lỗi mẹ máy chủ rồi!');
        }
    }

    function taiFileTxt() {
        const noiDung = document.getElementById('ketQua').value;
        const blob = new Blob([noiDung], { type: "text/plain" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Mail_Edu_Live.txt";
        a.click();
    }
</script>

</body>
</html>
